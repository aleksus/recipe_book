{% extends "base.html" %}

{% block title %}Delete {{ recipe.title }} | Recipe Book{% endblock %}

{% block content %}
    <section class="panel">
        <h1>Delete recipe</h1>
        <p>Are you sure you want to delete <strong>{{ recipe.title }}</strong>? This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <div class="actions">
                <button class="button danger" type="submit">Delete recipe</button>
                <a class="button secondary" href="{% url 'recipe-detail' recipe.pk %}">Cancel</a>
            </div>
        </form>
    </section>
{% endblock %}
