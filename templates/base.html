<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Recipe Book{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, sans-serif;
            color: #24302a;
            background: #f5f7f4;
        }
        body { margin: 0; }
        header { background: #244b38; color: white; }
        header nav, main { width: min(960px, calc(100% - 2rem)); margin: 0 auto; }
        header nav { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 0; }
        header nav a { color: white; text-decoration: none; }
        header nav .brand { font-size: 1.25rem; font-weight: 700; }
        main { padding: 2rem 0; }
        a { color: #246344; }
        .button { display: inline-block; padding: .65rem 1rem; border: 0; border-radius: .35rem; background: #246344; color: white; font: inherit; text-decoration: none; cursor: pointer; }
        .button.secondary { background: #59665e; }
        .button.danger { background: #a83232; }
        .actions { display: flex; flex-wrap: wrap; gap: .65rem; margin: 1rem 0; }
        .recipe-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; padding: 0; list-style: none; }
        .card, .panel { padding: 1.25rem; border: 1px solid #dce3dc; border-radius: .5rem; background: white; }
        .card h2 { margin-top: 0; }
        .ingredient-list { margin: 0; padding-left: 1.25rem; }
        .ingredient-list li { padding: .35rem 0; }
        .recipe-image { display: block; max-width: 100%; max-height: 28rem; object-fit: cover; border-radius: .4rem; }
        .field { margin: 1rem 0; }
        .field label { display: block; margin-bottom: .35rem; font-weight: 600; }
        .field input:not([type="checkbox"]), .field textarea, .field select { box-sizing: border-box; width: 100%; padding: .65rem; border: 1px solid #aeb9b0; border-radius: .3rem; font: inherit; }
        .field textarea { min-height: 8rem; }
        .errorlist { color: #a83232; }
        .muted { color: #5d6961; }
        .pagination { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
        .pagination a, .pagination span { padding: .4rem .65rem; border-radius: .3rem; }
        .pagination a { color: #246344; text-decoration: none; }
        .pagination a[aria-current="page"] { background: #246344; color: white; }
    </style>
</head>
<body>
    <header>
        <nav aria-label="Main navigation">
            <a class="brand" href="{% url 'home' %}">Recipe Book</a>
            <div class="actions">
                <a href="{% url 'recipe-list' %}">Recipes</a>
                <a href="{% url 'category-list' %}">Categories</a>
                <a href="{% url 'ingredient-list' %}">Ingredients</a>
                <a href="{% url 'cook-list' %}">Cooks</a>
            </div>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
